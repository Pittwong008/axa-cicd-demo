# .github/workflows/azure-style-pipeline.yml
name: Azure-Style CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  # Stage 1: DEV — 只在 develop 分支跑
  test-and-deploy-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: pip install pandas pytest flake8
      - name: Unit Tests (pytest)
        run: pytest tests/ -v --junitxml=test-results.xml
      - name: Lint (flake8)
        run: flake8 src/ --max-line-length=120
      - name: Deploy to DEV
        run: |
          echo "databricks workspace import_dir src/ /Shared/etl/ --profile DEV --overwrite"
          echo "[DEV] Cluster: small (2 nodes), Data: 100 rows"
          echo "✅ DEV deployed"

  # Stage 2: STAGING — 只在 main 分支跑，跳过测试
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to STAGING
        run: |
          echo "databricks workspace import_dir src/ /Shared/etl/ --profile STAGING --overwrite"
          echo "[STAGING] Cluster: medium (8 nodes, mirrors PROD)"
          echo "[STAGING] Data: 500 securities (full)"
          echo "[STAGING] Skipping tests (passed in DEV)"
          echo "✅ STAGING deployed"

  # Stage 3: PROD — STAGING成功后 + 人工审批
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: deploy-staging                  # STAGING失败=PROD不跑
    runs-on: ubuntu-latest
    environment:
      name: PROD                           # ← 审批门
      url: https://adb-prd.azuredatabricks.net
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to PROD
        run: |
          echo "🔒 APPROVAL GRANTED by Tech Lead"
          echo "databricks workspace import_dir src/ /Shared/etl/ --profile PROD --overwrite"
          echo "[PROD] Cluster: large (16 nodes)"
          echo "[PROD] Rollback: git tag PROD-v{previous} → redeploy"
          echo "✅ PROD deployed — VPFS downstream synced"

  # 失败通知 — 任何Job失败都触发
  notify-failure:
    if: failure()
    needs: [test-and-deploy-dev, deploy-staging, deploy-prod]
    runs-on: ubuntu-latest
    steps:
      - name: Send alert
        run: |
          echo "🚨 Pipeline FAILED!"
          echo "📧 Sending Teams/Email via Logic Apps connector"
          echo "📊 Check audit log: azure sql SELECT * FROM audit.pipeline_runs WHERE status='FAILED'"